name: Unzip upload
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          set -euxo pipefail
          unzip -o voiceproof.zip
          ls -R voiceproof
          rsync -a --exclude='.github/workflows/ci.yml' voiceproof/ ./
          cp voiceproof/.github/workflows/ci.yml ./ci.yml.staged
          rm -rf voiceproof voiceproof.zip
          git status --short
      - name: Commit extracted files
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract voiceproof.zip (ci.yml staged for manual move)" || echo "nothing to commit"
          git push
